services:
  - type: web
    name: flytbase-bdr-backend
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_DB_NAME
        value: flytbase_bdr
      - key: ALLOWED_ORIGINS
        value: https://flytbase-bdr-frontend.vercel.app
      - key: ALLOWED_HOSTS
        value: "*"
